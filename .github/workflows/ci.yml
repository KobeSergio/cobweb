name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  node:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build

  contracts:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: contracts
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      # The shipped collection bytecode in packages/shared/src/collection.ts must come from this build.
      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: nightly-6f49a622bd1c2219f918752b372d401aeeb8e851
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: forge fmt --check
      - run: forge build --sizes
      - run: forge test -vvv
      # The collection artifact the web app ships must be this build (docs/specs/2026-10-14-deploy.md, 5.3).
      - run: pnpm install --frozen-lockfile
        working-directory: ${{ github.workspace }}
      - run: pnpm --filter @cobweb/shared test
        working-directory: ${{ github.workspace }}

  slither:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      # Slither over both contracts (docs/specs/2026-10-18-load-run-contract-review-and-cloudflare.md, section 7.3):
      # a medium or high finding that contracts/slither.db.json does not hold fails the job; low and informational
      # findings print and pass. contracts/slither.triage.md gives each held finding's verdict and reason.
      - uses: crytic/slither-action@v0.4.2
        with:
          target: contracts
          slither-version: 0.11.6
          slither-config: contracts/slither.config.json
          slither-args: --triage-database contracts/slither.db.json
          fail-on: medium
